<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DİNGA - Oyun</title>
    <link rel="stylesheet" href="game.css" />
</head>
<body>
    <div class="game-container">
        <h2 id="playerName"></h2>
        <p id="question"></p>
        <input type="text" id="answer" placeholder="Cevabınızı yazınız..." autocomplete="off" />
        <br />
        <button id="submitButton" onclick="submitAnswer()">Gönder</button>
        <button id="skipButton" onclick="skipQuestion()" style="display:none;">Geç</button>
        <button id="nextQuestion" onclick="nextQuestion()" style="display:none;">Sonraki Soru</button>
        <button id="passButton" onclick="usePass()" style="display:inline-block;">Pas</button>
        <button id="collapseButton" onclick="collapseTower()">Kule Devrildi</button>
        <button id="endButton" onclick="endGame()">Bitir</button>
        <p id="resultMessage"></p>
    </div>

    <div class="footer-text">Hazırlayan Ömer Baran Günaydın</div>

    <script src="game.js"></script>
</body>
</html>
