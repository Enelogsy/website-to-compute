<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DİNGA - Kullanıcı Girişi</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>DİNGA</h1>
        <form id="usernameForm">
            <label for="username">Kullanıcı Adınız:</label>
            <input type="text" id="username" autocomplete="off" placeholder="Kullanıcı adınızı giriniz..." required />
            <button type="submit" id="startButton">Başla</button>
        </form>
        <p id="errorMessage" style="color: red; display: none;">Lütfen bir kullanıcı adı girin!</p>
        <p class="footer-text">Hazırlayan: Ömer Baran Günaydın</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
